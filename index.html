<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11182c" />
    <title>STAR TAP — 星をつかまえよう</title>
  </head>
  <body>
    <main class="game">
      <header>
        <p class="eyebrow">A LITTLE BROWSER GAME</p>
        <h1>STAR <span>TAP</span></h1>
        <p class="intro">20秒間で、いくつ星をつかまえられる？</p>
      </header>
      <section class="stats" aria-label="ゲームの記録">
        <div><span>スコア</span><strong id="score">0</strong></div>
        <div><span>残り時間</span><strong><span id="time">20</span><small>秒</small></strong></div>
        <div><span>ベスト</span><strong id="best">0</strong></div>
      </section>
      <section class="board" aria-label="プレイエリア">
        <p id="message" role="status">準備はいい？<br /><span>スタートして、星をタップ！</span></p>
        <button id="target" type="button" aria-label="星をつかまえる" hidden>★</button>
      </section>
      <button id="start" class="start" type="button">ゲームをはじめる <span aria-hidden="true">↗</span></button>
      <p class="hint">クリック・タップで遊べます。Tab と Enter でも操作できます。</p>
      <footer>ちょっとひと息、星あつめ。</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
